services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_assistant
    ports: ["5432:5432"]
    volumes: [sales_assistant_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  sales_assistant_data:
